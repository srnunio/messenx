name: PR CI, Release & Publish to pub.dev

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

jobs:
  test-and-analyze:
    name: Analyze & Test
    if: github.event_name == 'push' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && (github.event.pull_request.merged == true && 'main' || github.event.pull_request.head.sha) || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze code
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Validate pub.dev package (dry-run)
        run: dart pub publish --dry-run

  release-on-pr-merge:
    name: Create Release & Publish on PR Merge
    needs: test-and-analyze
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract version from pubspec.yaml
        id: package_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Git Tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.package_version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" \
              --target main \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Publish to pub.dev
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          VERSION="${{ steps.package_version.outputs.version }}"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pub.dev/api/packages/messenx/versions/$VERSION")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "messenx $VERSION is already published on pub.dev. Skipping upload."
            exit 0
          fi
          if [ -n "$PUB_CREDENTIALS" ]; then
            mkdir -p "$HOME/.config/dart" "${PUB_CACHE:-$HOME/.pub-cache}"
            echo "$PUB_CREDENTIALS" > "$HOME/.config/dart/pub-credentials.json"
            echo "$PUB_CREDENTIALS" > "${PUB_CACHE:-$HOME/.pub-cache}/credentials.json"
            flutter pub get
            dart pub publish --force
          else
            TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://pub.dev" | jq -r '.value')
            export PUB_TOKEN="$TOKEN"
            dart pub token add https://pub.dev --env-var=PUB_TOKEN
            flutter pub get
            dart pub publish --force
          fi

  publish-oidc:
    name: Publish to pub.dev (GitHub Actions OIDC)
    needs: test-and-analyze
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check if version is already published and publish via OIDC
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pub.dev/api/packages/messenx/versions/$VERSION")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "messenx $VERSION is already published on pub.dev. Skipping upload."
            exit 0
          fi
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://pub.dev" | jq -r '.value')
          export PUB_TOKEN="$TOKEN"
          dart pub token add https://pub.dev --env-var=PUB_TOKEN
          flutter pub get
          dart pub publish --force
